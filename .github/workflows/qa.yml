name: Film journal QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: films_test
          POSTGRES_USER: fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432/tcp']
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check personal reviews, RLS and grants on disposable PostgreSQL
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGHOST: localhost
          PGUSER: fixture
          PGDATABASE: films_test
        run: npm run test:db
      - run: npm ci --ignore-scripts && npm test && npm run build
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test desktop and mobile in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-interface-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
